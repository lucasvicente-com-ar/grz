<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Una mesa redonda con dos sillas, una vacía, bajo un rayo de luz de domingo que entra por una ventana alta.">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="rayC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2cf7a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f2cf7a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bgC)"/>

  <!-- tall window, upper right -->
  <rect x="330" y="60" width="90" height="180" fill="none" stroke="#8a7239" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="375" y1="60" x2="375" y2="240" stroke="#8a7239" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="330" y1="150" x2="420" y2="150" stroke="#8a7239" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- light ray crossing the room to the table -->
  <polygon points="345,90 405,90 300,470 170,470" fill="url(#rayC)"/>

  <!-- round table -->
  <ellipse cx="235" cy="420" rx="130" ry="34" fill="none" stroke="#c9a24b" stroke-opacity="0.55" stroke-width="2.5"/>
  <line x1="235" y1="454" x2="235" y2="520" stroke="#c9a24b" stroke-opacity="0.4" stroke-width="6"/>

  <!-- occupied chair, left -->
  <g stroke="#9b9689" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M105 470 L110 400 M110 400 L150 400 M150 400 L155 470"/>
    <path d="M110 400 L112 360 M150 400 L148 360"/>
    <ellipse cx="130" cy="392" rx="26" ry="30" fill="#050506" stroke="#050506"/>
    <circle cx="130" cy="352" r="14" fill="#050506" stroke="#9b9689" stroke-opacity="0.6"/>
  </g>

  <!-- empty chair, right — outline only -->
  <g stroke="#c9a24b" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M320 470 L325 400 M325 400 L365 400 M365 400 L370 470"/>
    <path d="M325 400 L327 360 M365 400 L363 360"/>
  </g>

  <!-- two cups on the table -->
  <circle cx="200" cy="416" r="8" fill="none" stroke="#c9a24b" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="285" cy="414" r="8" fill="none" stroke="#c9a24b" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
