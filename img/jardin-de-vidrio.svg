<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Un jardín de flores de vidrio quebrado frente a una ventana de hotel, con la silueta de un ídolo de madera sin rostro al fondo.">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="glassF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeaf2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8fb4c9" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bgF)"/>

  <!-- hotel window grid, background -->
  <g stroke="#8a7239" stroke-opacity="0.35" stroke-width="1.5">
    <rect x="60" y="50" width="360" height="220"/>
    <line x1="240" y1="50" x2="240" y2="270"/>
    <line x1="60" y1="160" x2="420" y2="160"/>
  </g>

  <!-- faceless wooden idol, silhouette behind the glass garden -->
  <g fill="#1c140b" opacity="0.9">
    <path d="M340 270 C340 220 320 190 300 190 C280 190 260 220 260 270 L260 470 L340 470 Z"/>
    <ellipse cx="300" cy="175" rx="26" ry="30"/>
  </g>
  <line x1="300" y1="160" x2="300" y2="470" stroke="#c9a24b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- glass garden: broken shard-flowers -->
  <g stroke="#dfeaf2" stroke-width="1.4" fill="url(#glassF)" stroke-opacity="0.75">
    <polygon points="120,470 140,410 165,440 150,480"/>
    <polygon points="150,480 165,440 190,455 175,500"/>
    <polygon points="190,470 210,400 235,435 215,485"/>
    <polygon points="70,490 90,440 112,460 95,510"/>
  </g>

  <!-- cracks / fracture lines across the garden -->
  <g stroke="#dfeaf2" stroke-width="1" stroke-opacity="0.5">
    <line x1="140" y1="410" x2="160" y2="430"/>
    <line x1="210" y1="400" x2="225" y2="420"/>
    <line x1="90" y1="440" x2="105" y2="465"/>
  </g>

  <!-- a single warm ember among the cold glass -->
  <circle cx="175" cy="455" r="5" fill="#f2cf7a" opacity="0.85"/>

  <!-- ground line -->
  <line x1="0" y1="500" x2="480" y2="500" stroke="#c9a24b" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
