<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Un reloj de arena que se transforma en el símbolo del infinito, rodeado de estrellas lejanas.">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <radialGradient id="haloE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bgE)"/>
  <circle cx="240" cy="300" r="220" fill="url(#haloE)"/>

  <!-- scattered stars -->
  <g fill="#e9e4d6" opacity="0.7">
    <circle cx="70" cy="90" r="1.6"/>
    <circle cx="120" cy="180" r="1.2"/>
    <circle cx="380" cy="110" r="1.6"/>
    <circle cx="410" cy="220" r="1.2"/>
    <circle cx="60" cy="480" r="1.4"/>
    <circle cx="420" cy="500" r="1.6"/>
    <circle cx="150" cy="530" r="1.2"/>
    <circle cx="340" cy="540" r="1.4"/>
  </g>

  <!-- hourglass silhouette -->
  <path d="M170 160 H310 L250 300 L310 440 H170 L230 300 Z"
        fill="none" stroke="#9b9689" stroke-width="2.2" stroke-opacity="0.6"/>
  <line x1="170" y1="160" x2="310" y2="160" stroke="#c9a24b" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="170" y1="440" x2="310" y2="440" stroke="#c9a24b" stroke-width="3" stroke-opacity="0.7"/>

  <!-- sand settled, becoming the infinity loop at the waist -->
  <path d="M240 260 C200 260 200 300 240 300 C280 300 280 340 240 340 C200 340 200 300 240 300 C280 300 280 260 240 260 Z"
        fill="none" stroke="#f2cf7a" stroke-width="2.6"/>

  <!-- fine grains still falling -->
  <g fill="#c9a24b" opacity="0.8">
    <circle cx="238" cy="220" r="1.6"/>
    <circle cx="244" cy="235" r="1.6"/>
    <circle cx="240" cy="250" r="1.6"/>
  </g>
</svg>
